name: rove_customer_app
description: "Rove customer app — car rentals in India and the UAE."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  go_router: ^18.0.2
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.18.2
  intl: ^0.20.2
  timezone: ^0.11.1
  cached_network_image: ^4.0.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.1
  bloc_concurrency: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
